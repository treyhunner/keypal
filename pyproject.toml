[project]
name = "keypal"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Trey Hunner" }
]
requires-python = ">=3.14"
dependencies = [
    "fsrs>=6.3,<7",
    "textual>=3.0",
]

[project.scripts]
keypal = "keypal.app:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]
