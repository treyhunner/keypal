[project]
name = "keypal"
version = "0.1.0"
description = "Learn the keyboard shortcuts for common apps"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Trey Hunner" }
]
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Topic :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "darkdetect>=0.8.0",
    "fsrs>=6.3,<7",
    "platformdirs>=4.9.6",
    "textual>=3.0",
]

[project.scripts]
keypal = "keypal.app:main"

[project.urls]
Homepage = "https://github.com/treyhunner/keypal"
Repository = "https://github.com/treyhunner/keypal"
Issues = "https://github.com/treyhunner/keypal/issues"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.12",
]
