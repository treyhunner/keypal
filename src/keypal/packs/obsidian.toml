[pack]
id = "obsidian"
name = "Obsidian"
description = "Useful Obsidian shortcuts. Customs are read live from your hotkeys.json."


# === Core navigation ===

[[shortcuts]]
action = "Open command palette"
keys = ["ctrl+p"]
tags = ["navigation"]
command = "command-palette:open"

[[shortcuts]]
action = "Quick switcher (open file)"
keys = ["ctrl+o"]
tags = ["navigation"]
command = "switcher:open"

[[shortcuts]]
action = "Search the current note"
keys = ["ctrl+f"]
tags = ["navigation"]
command = "editor:open-search"

[[shortcuts]]
action = "Search across the vault"
keys = ["ctrl+shift+f"]
tags = ["navigation"]
command = "global-search:open"

[[shortcuts]]
action = "Open graph view"
keys = ["ctrl+g"]
tags = ["navigation"]
command = "graph:open"

[[shortcuts]]
action = "Navigate back"
keys = ["alt+left"]
tags = ["navigation"]
command = "app:go-back"

[[shortcuts]]
action = "Navigate forward"
keys = ["alt+right"]
tags = ["navigation"]
command = "app:go-forward"


# === Files & tabs ===

[[shortcuts]]
action = "New note"
keys = ["ctrl+n"]
tags = ["files"]
command = "file-explorer:new-file"

[[shortcuts]]
action = "Close current tab"
keys = ["ctrl+w"]
tags = ["files"]
command = "workspace:close"

[[shortcuts]]
action = "Reopen closed tab"
keys = ["ctrl+shift+t"]
tags = ["files"]
command = "workspace:undo-close-pane"


# === Modes ===

[[shortcuts]]
action = "Toggle edit/preview mode"
keys = ["ctrl+e"]
tags = ["modes"]
command = "markdown:toggle-preview"

[[shortcuts]]
action = "Toggle source/live-preview"
keys = ["ctrl+m"]
tags = ["modes"]
command = "editor:toggle-source"


# === Workspace splits ===

[[shortcuts]]
action = "Split editor vertically"
keys = ["ctrl+\\"]
tags = ["workspace"]
command = "workspace:split-vertical"

[[shortcuts]]
action = "Split editor horizontally"
keys = ["ctrl+-"]
tags = ["workspace"]
command = "workspace:split-horizontal"

[[shortcuts]]
action = "Open tag pane"
keys = ["ctrl+alt+shift+t"]
tags = ["workspace"]
command = "tag-pane:open"


# === Editing ===

[[shortcuts]]
action = "Bold selection"
keys = ["ctrl+b"]
tags = ["editing"]
command = "editor:toggle-bold"

[[shortcuts]]
action = "Italic selection"
keys = ["ctrl+i"]
tags = ["editing"]
command = "editor:toggle-italics"

[[shortcuts]]
action = "Insert link"
keys = ["ctrl+k"]
tags = ["editing"]
command = "editor:insert-link"

[[shortcuts]]
action = "Toggle checklist item"
keys = ["ctrl+l", "ctrl+enter"]
tags = ["editing"]
command = "editor:toggle-checklist-status"


# === Outliner plugin ===

[[shortcuts]]
action = "Move list item up"
keys = ["alt+shift+up"]
tags = ["outliner"]
command = "obsidian-outliner:move-list-item-up"

[[shortcuts]]
action = "Move list item down"
keys = ["alt+shift+down"]
tags = ["outliner"]
command = "obsidian-outliner:move-list-item-down"


# === Meta ===

[[shortcuts]]
action = "Open settings"
keys = ["ctrl+,"]
tags = ["meta"]
command = "app:open-settings"
