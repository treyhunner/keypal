[pack]
id = "tmux"
name = "tmux"
description = "tmux shortcuts (after the prefix). Reflects Trey's custom config."
prefix = "ctrl+a"


# === Window management ===

[[shortcuts]]
action = "Next window"
keys = ["n"]
tags = ["windows"]
capturable = false

[[shortcuts]]
action = "Previous window"
keys = ["p"]
tags = ["windows"]
capturable = false

[[shortcuts]]
action = "Last (most recent) window"
keys = ["a"]
tags = ["windows"]
capturable = false

[[shortcuts]]
action = "New window in current directory"
keys = ["c"]
tags = ["windows"]
capturable = false

[[shortcuts]]
action = "Rename window"
keys = [","]
tags = ["windows"]
capturable = false

[[shortcuts]]
action = "Find window by name"
keys = ["f"]
tags = ["windows"]
capturable = false

[[shortcuts]]
action = "Show window/session tree picker"
keys = ["w"]
tags = ["windows"]
capturable = false

[[shortcuts]]
action = "Kill window"
keys = ["&"]
tags = ["windows"]
capturable = false


# === Pane navigation (vim-style customs) ===

[[shortcuts]]
action = "Select pane to the left"
keys = ["h"]
tags = ["panes", "navigation"]
capturable = false

[[shortcuts]]
action = "Select pane below"
keys = ["j"]
tags = ["panes", "navigation"]
capturable = false

[[shortcuts]]
action = "Select pane above"
keys = ["k"]
tags = ["panes", "navigation"]
capturable = false

[[shortcuts]]
action = "Select pane to the right"
keys = ["l"]
tags = ["panes", "navigation"]
capturable = false


# === Pane management ===

[[shortcuts]]
action = "Split pane horizontally (side-by-side)"
keys = ["|"]
tags = ["panes", "layout"]
capturable = false

[[shortcuts]]
action = "Split pane vertically (stacked)"
keys = ["-"]
tags = ["panes", "layout"]
capturable = false

[[shortcuts]]
action = "Kill the current pane"
keys = ["x"]
tags = ["panes"]
capturable = false

[[shortcuts]]
action = "Show pane numbers (then press one to jump)"
keys = ["q"]
tags = ["panes"]
capturable = false

[[shortcuts]]
action = "Cycle to next layout"
keys = ["space"]
tags = ["panes", "layout"]
capturable = false


# === Pane resize (with -r repeat: hold prefix once, then repeat) ===

[[shortcuts]]
action = "Resize pane left"
keys = ["H"]
tags = ["panes", "resize"]
capturable = false

[[shortcuts]]
action = "Resize pane down"
keys = ["J"]
tags = ["panes", "resize"]
capturable = false

[[shortcuts]]
action = "Resize pane up"
keys = ["K"]
tags = ["panes", "resize"]
capturable = false

[[shortcuts]]
action = "Resize pane right"
keys = ["L"]
tags = ["panes", "resize"]
capturable = false


# === Sessions ===

[[shortcuts]]
action = "Detach from session"
keys = ["d"]
tags = ["sessions"]
capturable = false

[[shortcuts]]
action = "Choose session"
keys = ["s"]
tags = ["sessions"]
capturable = false

[[shortcuts]]
action = "Rename session"
keys = ["$"]
tags = ["sessions"]
capturable = false


# === Modes ===

[[shortcuts]]
action = "Enter copy mode"
keys = ["["]
tags = ["copy"]
capturable = false

[[shortcuts]]
action = "Paste most recent buffer"
keys = ["]"]
tags = ["copy"]
capturable = false

[[shortcuts]]
action = "Open command prompt"
keys = [":"]
tags = ["meta"]
capturable = false

[[shortcuts]]
action = "Reload tmux config"
keys = ["R"]
tags = ["meta"]
capturable = false


# === Layouts (Alt + 1..5) ===

[[shortcuts]]
action = "Layout: even-horizontal"
keys = ["alt+1"]
tags = ["layout"]
capturable = false

[[shortcuts]]
action = "Layout: even-vertical"
keys = ["alt+2"]
tags = ["layout"]
capturable = false

[[shortcuts]]
action = "Layout: main-horizontal"
keys = ["alt+3"]
tags = ["layout"]
capturable = false

[[shortcuts]]
action = "Layout: main-vertical"
keys = ["alt+4"]
tags = ["layout"]
capturable = false

[[shortcuts]]
action = "Layout: tiled"
keys = ["alt+5"]
tags = ["layout"]
capturable = false
